name: End-to-End MLOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mlops-run:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Python Environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Cache packages to make workflows run faster
    - name: Cache Pip Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Install Dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas pytest; fi
    
    # 4.1 install pyymal
    - name: Install PyYAML
      run: |
        python -m pip install PyYAML

    # 5. Run Preprocessing Unit Tests
    - name: Run Unit Tests with Pytest
      run: |
        python -m pytest
    

    # 6. Execute End-to-End Pipeline & Log to Databricks
    # Injects GitHub repository secrets into runner environment variables temporarily
    - name: Trigger Model Training and MLflow Tracking
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        DATABRICKS_USER_EMAIL: ${{ secrets.DATABRICKS_USER_EMAIL }}
      run: |
        python main.py
